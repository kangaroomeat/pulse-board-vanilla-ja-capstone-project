<!doctype html>
<html lang="en-us">
    <head>
        <title>pulseBoard | vanilla js solo project</title>
        <link rel="stylesheet" href="styles.css">
        <meta charset="utf-8">
    </head>
    <body>
        <main>
            <div class="task-board">

                <div class="add-task-btn">
                    <button>add task</button>

                </div>
                <div class="to-do card" >
                    <h3>to do:</h3>
                    
                </div>

                <div class="in-progress card">
                    <h3>in progress:</h3>
                </div>

                <div class="done card">
                    <h3>done:</h3>
                </div>
            </div>

            <select>
                <option>add to "in progress"</option>
                <option>dog</option>
            </select>

            <button id="test-btn">confirm</button>

            <div class="pop-up">
                <input type="checkbox" id="addToProgress" unchecked>
                <label for="addToProgress">Add to progress list</label>
            </div>

        </main>

        <script src="app.js"></script>
        
    </body>
    
</html>
